<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cancionero Común</title>
<meta name="description" content="Repertorio y acordes compartidos entre tunas: cada canción con las versiones de cada tuna, comparables lado a lado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: wordmark + ribbon strip of every tuna's beca colour, then song list sidebar beside the song sheet; stacks on phones */
:root{
  --bg:#f4f3f6; --surface:#ffffff; --sunk:#ebe9ef; --ink:#1b1820; --muted:#665f6e; --line:#dcd8e2;
  --accent:#8e1b33; --accent-ink:#ffffff; --accent-soft:#f5e3e7;
  --diff-bg:#fbe4a0; --diff-ink:#5b3d00; --ok:#1f7a4a; --warn:#a0520c;
  --f-display:"Alegreya SC",Georgia,"Times New Roman",serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141217; --surface:#1d1a21; --sunk:#26222b; --ink:#ece8f0; --muted:#a39cab; --line:#332e39;
  --accent:#e2738a; --accent-ink:#1b0d11; --accent-soft:#3a1c24; --diff-bg:#5a430c; --diff-ink:#ffe7a6; --ok:#5fc68f; --warn:#f0a35c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141217; --surface:#1d1a21; --sunk:#26222b; --ink:#ece8f0; --muted:#a39cab; --line:#332e39;
  --accent:#e2738a; --accent-ink:#1b0d11; --accent-soft:#3a1c24; --diff-bg:#5a430c; --diff-ink:#ffe7a6; --ok:#5fc68f; --warn:#f0a35c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:22px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px}
.brand h1{font:700 clamp(28px,5vw,40px)/1 var(--f-display);margin:0;letter-spacing:.01em}
.brand p{margin:4px 0 0;color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center}
.ribbons{display:flex;height:8px;margin-top:16px;border-radius:2px;overflow:hidden;background:var(--sunk)}
.ribbons span{flex:1}
nav.tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:500 15px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
main{padding-block:20px 60px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.layout.detail .side{display:none}.layout:not(.detail) .sheet{display:none}}
@media (min-width:821px){.backlink{display:none!important}}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
input[type=text],input[type=url],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
textarea{min-height:220px;font:14px/1.6 var(--f-mono);resize:vertical}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.songlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 260px);overflow:auto}
@media (max-width:820px){.songlist{max-height:none}}
.songlist li+li{border-top:1px solid var(--line)}
.songlist button{all:unset;box-sizing:border-box;display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;cursor:pointer}
.songlist button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.songlist button[aria-current="true"]{background:var(--accent-soft)}
.songlist .t{flex:1;min-width:0}
.songlist .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songlist .t small{color:var(--muted);font-size:13px}
.dots{display:flex;gap:3px;flex-shrink:0}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.count{font:500 12px var(--f-mono);color:var(--muted)}
.empty{padding:28px;text-align:left;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);font:700 20px var(--f-display);margin:0 0 6px}
.sheet{min-width:0;display:flex;flex-direction:column;gap:22px}
.songhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
.songhead h2{font:700 clamp(26px,4vw,34px)/1.1 var(--f-display);margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);margin-top:6px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.b[aria-pressed="true"]{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.beca{width:6px;height:18px;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 12px;background:var(--sunk);border-radius:var(--r)}
.bar .grp{display:flex;align-items:center;gap:6px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.stepper button{border:0;background:none;padding:4px 10px;cursor:pointer;font:600 16px var(--f-mono)}
.stepper output{min-width:34px;text-align:center;font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cols{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:20px}
@media (max-width:640px){.cols{grid-template-columns:minmax(0,1fr)}}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.chart .vh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.chart .vh b{font:700 17px var(--f-display);display:flex;align-items:center;gap:8px}
.chart .vh small{color:var(--muted);font-size:13px}
.cp{overflow-x:auto}
.cp .ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.6em;margin-bottom:4px}
.cp .sg{display:inline-flex;flex-direction:column;white-space:pre}
.cp .ch{font:600 14px/1.3 var(--f-mono);color:var(--accent);min-height:1.3em;padding-right:6px}
.cp .ch.d{background:var(--diff-bg);color:var(--diff-ink);border-radius:3px;padding:0 4px;margin-right:4px}
.cp .ch.an{color:var(--muted);font-weight:500;font-size:12px}
.gridrow{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(56px,84px));border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
@media (max-width:640px){.grid{grid-template-columns:repeat(var(--cols-sm),minmax(56px,1fr))}}
.gbar{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:2px 6px;min-height:34px;padding:4px 10px;border-right:1px solid var(--line);border-block:1px solid var(--line)}
.gbar:last-child{border-right:0}
.gbar .gc{font:600 14px var(--f-mono);color:var(--accent)}
.gbar .gc.d{background:var(--diff-bg);color:var(--diff-ink);border-radius:3px;padding:0 4px}
.gbar .an{font:500 11px var(--f-mono);color:var(--muted)}
.gbar .gdot{color:var(--muted)}
.gbar.rs{border-left:3px double var(--ink);padding-left:14px}
.gbar.rs::before{content:":";position:absolute;left:4px;font-weight:700;color:var(--ink)}
.gbar.re{border-right:3px double var(--ink);padding-right:14px}
.gbar.re::after{content:":";position:absolute;right:4px;font-weight:700;color:var(--ink)}
.gtimes{font:600 13px var(--f-mono);color:var(--muted)}
.cp .tx{font-size:17px;line-height:1.35}
.cp .sec{font:500 12px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:14px 0 4px}
.cp .ln.only .tx{display:none}
.vnotes{margin-top:12px;color:var(--muted);font-size:14px;white-space:pre-wrap}
h3.sh{font:700 20px var(--f-display);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reclist{display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.rec .beca{height:100%;min-height:36px}
.rec b{font-weight:500}
.rec small{display:block;color:var(--muted);font-size:13px}
.rec video{width:100%;max-height:320px;margin-top:8px;border-radius:4px;background:#000}
.rec img{margin-top:8px;border-radius:4px;max-height:320px}
.rec a{color:var(--accent)}
.tunagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tuna{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.tuna .stripe{height:10px}
.tuna .bd{padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tuna h3{font:700 20px var(--f-display);margin:0}
.tuna .rep{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px}
.tuna .rep button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.tuna .stats{font:500 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgb(10 8 14 / .55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;z-index:50;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(680px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{font:700 22px var(--f-display);margin:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:13px;color:var(--muted)}
.hint code{font:13px var(--f-mono);background:var(--sunk);padding:1px 4px;border-radius:3px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.notice{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:var(--r);padding:8px 12px}
.reclist .flt{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:border-color .15s,box-shadow .15s}}
.code{position:relative;margin:8px 0}
.code pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--f-mono)}
.code .btn{position:absolute;top:6px;right:6px}
.join{max-width:760px}.join ol{padding-left:20px;display:flex;flex-direction:column;gap:14px}
a{color:var(--accent)}
footer{padding-block:0 32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">
    <div><h1>Cancionero Común</h1><p id="tagline"></p></div>
    <div class="tools"><button class="btn ghost" id="lang" type="button"></button><a class="btn" id="repo" target="_blank" rel="noopener"></a></div>
  </div>
  <div class="ribbons" id="ribbons" aria-hidden="true"></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>
<script>
/* ---------- chords ---------- */
const LATIN={do:0,re:2,mi:4,fa:5,sol:7,la:9,si:11},ENG={c:0,d:2,e:4,f:5,g:7,a:9,b:11};
const OUT_EN=["C","C#","D","Eb","E","F","F#","G","G#","A","Bb","B"],OUT_LAT=["Do","Do#","Re","Mib","Mi","Fa","Fa#","Sol","Sol#","La","Sib","Si"];
function parseRoot(s){
  let m=s.match(/^(sol|do|re|mi|fa|la|si)(#|b)?/i);
  if(m) return {idx:(LATIN[m[1].toLowerCase()]+(m[2]==="#"?1:m[2]==="b"?-1:0)+12)%12,len:m[0].length,lat:true,upper:m[1]===m[1].toUpperCase()};
  m=s.match(/^([A-Ga-g])(#|b)?/);
  if(m) return {idx:(ENG[m[1].toLowerCase()]+(m[2]==="#"?1:m[2]==="b"?-1:0)+12)%12,len:m[0].length,lat:false};
  return null;
}
function xposePart(p,n,nota){
  const r=parseRoot(p); if(!r) return p;
  if(n===0&&nota==="orig") return p;
  const i=((r.idx+n)%12+12)%12, useLat=nota==="lat"||(nota==="orig"&&r.lat);
  let root=useLat?OUT_LAT[i]:OUT_EN[i];
  if(useLat&&nota==="orig"&&r.upper) root=root.toUpperCase().replace("B","b");
  return root+p.slice(r.len);
}
const xpose=(c,n,nota)=>c.split("/").map(p=>xposePart(p.trim(),n,nota)).join("/");
function norm(c){return c.split("/").map(p=>{const r=parseRoot(p.trim());return r?r.idx+":"+p.trim().slice(r.len).toLowerCase():p.trim().toLowerCase()}).join("/")}
function parseCP(text){
  return String(text||"").replace(/\r/g,"").split("\n").map(line=>{
    if(/^\s*#/.test(line)) return {sec:line.replace(/^\s*#\s*/,"")};
    const segs=[];const re=/\[([^\]]+)\]/g;let last=0,m,pending=null;
    while((m=re.exec(line))){const txt=line.slice(last,m.index);if(pending!==null||txt)segs.push({c:pending,x:txt});pending=m[1].trim();last=re.lastIndex}
    segs.push({c:pending,x:line.slice(last)});
    const clean=segs.filter((s,i)=>s.c||s.x||i===0);
    return {segs:clean,only:clean.every(s=>!s.x.trim()),raw:line};
  });
}
function isGrid(raw){
  const r=String(raw||"");if(!r.includes("|")||!/\[[^*\]]/.test(r))return false;
  return /^[\s|.·:%()x\d]*$/i.test(r.replace(/\[[^\]]*\]/g,""));
}
function renderGrid(raw,n,nota,bch,next){
  let parts=raw.trim().split("|");
  if(raw.trim().startsWith("|"))parts.shift();
  if(raw.trim().endsWith("|"))parts.pop();
  let times="";
  const cells=parts.map(p=>{
    const tm=/\((\d+)\s*x\)/i.exec(p);if(tm){times=tm[1]+"×";p=p.replace(tm[0],"")}
    let q=p.trim();const rs=q.startsWith(":");if(rs)q=q.slice(1).trim();
    const re=q.endsWith(":")&&!q.endsWith("]:");if(re)q=q.slice(0,-1).trim();
    const toks=q.match(/\[[^\]]+\]|[.·%]/g)||[];
    const hasChord=toks.some(x=>x[0]==="["&&x[1]!=="*");
    const html=toks.map(x=>{
      if(x[0]!=="[")return hasChord||toks.length===1?'<span class="gdot">·</span>':"";
      const c=x.slice(1,-1).trim();
      if(c[0]==="*")return `<span class="an">${esc(c.slice(1))}</span>`;
      const i=next();const d=bch&&bch[i]!==norm(xpose(c,n,"en"))?" d":"";
      return `<span class="gc${d}">${esc(xpose(c,n,nota))}</span>`;
    }).join("");
    return `<div class="gbar${rs?" rs":""}${re?" re":""}">${html||'<span class="gdot">·</span>'}</div>`;
  });
  const N=cells.length,cols=N>8&&N%8===0?8:N,sm=cols<=4?cols:Math.ceil(cols/Math.ceil(cols/4));
  return `<div class="gridrow"><div class="grid" style="--cols:${cols};--cols-sm:${sm}">${cells.join("")}</div>${times?`<span class="gtimes">${times}</span>`:""}</div>`;
}
function renderCP(text,n,nota,base,baseShift){
  const lines=parseCP(text),bl=base?parseCP(base.text):null;
  let li=0;
  return lines.map(L=>{
    if(L.sec!==undefined) return `<div class="sec">${esc(L.sec)}</div>`;
    const b=bl?(bl.filter(x=>!x.sec)[li]||null):null; li++;
    const bch=b?b.segs.filter(s=>s.c&&s.c[0]!=="*").map(s=>norm(xpose(s.c,baseShift,"en"))):null;
    let ci=0;
    if(isGrid(L.raw))return renderGrid(L.raw,n,nota,bch,()=>ci++);
    const segs=L.segs.map(s=>{
      if(s.c&&s.c[0]==="*")return `<span class="sg"><span class="ch an">${esc(s.c.slice(1))}</span><span class="tx">${esc(s.x)||" "}</span></span>`;
      let cls="ch";
      if(s.c&&bch){const mine=norm(xpose(s.c,n,"en"));if(bch[ci]!==mine)cls+=" d";}
      if(s.c)ci++;
      return `<span class="sg"><span class="${cls}">${s.c?esc(xpose(s.c,n,nota)):""}</span><span class="tx">${esc(s.x)||" "}</span></span>`;
    }).join("");
    return `<div class="ln${L.only?" only":""}">${segs}</div>`;
  }).join("");
}
const keyIdx=k=>{const r=k?parseRoot(String(k).trim()):null;return r?r.idx:null};


/* ---------- Tunabundel (.tex) import, runs in the viewer's browser ---------- */
const TEX_GENRE={paso_doble:"pasodoble",vals:"vals",tango:"tango",bolero:"bolero",son:"son"};
const CHORD_OK=/^(?:[A-G]|Do|Re|Mi|Fa|Sol|La|Si)(?:#|b)?(?:m|maj|min|dim|aug|sus|add|°|\+|ø|\d|\(|\)|M)*(?:\/(?:[A-G]|Do|Re|Mi|Fa|Sol|La|Si)(?:#|b)?)?$/;
function texBraced(s,i){let d=0;for(let j=i;j<s.length;j++){if(s[j]==="{")d++;else if(s[j]==="}"){d--;if(d===0)return[s.slice(i+1,j),j+1]}}return[s.slice(i+1),s.length]}
function texChord(c){
  c=c.replace(/\$\\sharp\$|\\sharp/g,"#").replace(/\$\\flat\$|\\flat/g,"b");
  if(/^[A-G][#b]?\$\\circ\$$/.test(c.trim()))c=c.replace("$\\circ$","°");
  c=c.trim().split(/\$|;|:|\s/)[0].replace(/\\/g,"").trim();
  return c&&CHORD_OK.test(c)?c:null;
}
function texMacros(s,name){const out=[],re=new RegExp("\\\\"+name+"\\*?\\{","g");let m;while((m=re.exec(s))){const[b,end]=texBraced(s,re.lastIndex-1);out.push([m.index,end,texChord(b)]);re.lastIndex=end}return out}
function texText(t){
  t=t.replace(/!`/g,"¡").replace(/\?`/g,"¿").replace(/\\'\{?\\i\}?/g,"í")
   .replace(/\\'\{?([aeiouAEIOU])\}?/g,(_,v)=>(v+"́").normalize("NFC"))

  const title=texText(texBraced(raw,m.index+m[0].length-1)[0]).trim();if(!title)return null;
  const style=(m[1]||"").trim();let key="",meter="";
  const km=/\\rhythmandkey\*?(?:\[([^\]]*)\])?\{([^{}]*)\}\{/.exec(raw);
  if(km){key=texChord(texBraced(raw,km.index+km[0].length-1)[0].replace(/\\chord\*?\{([^{}]*)\}/g,"$1"))||"";const mm=/nicefrac\{(\d+)\}\{(\d+)\}/.exec(km[1]||"");if(mm)meter=mm[1]+"/"+mm[2]}

  while((b=re.exec(raw))){

    lines.push("#"+(texText(b[2]).trim()||b[1]));
    if(b[1]==="instrumental"){for(const row of b[3].split(/\\\\|\n/)){const ms=texMacros(row,"measure");if(!ms.length)continue;const cells=ms.map(x=>x[2]?"["+x[2]+"]":"·");if(cells.some(x=>x!=="·"))lines.push(cells.join(" | "))}}

}

/* ChordPro reader for contributed songs */
function parseChordPro(raw,fallbackTitle){
  let title="",key="",capo="",artist="",meter="",genre="";const out=[];
  const GMAP={"paso doble":"pasodoble",pasodoble:"pasodoble",vals:"vals",wals:"vals",tango:"tango",bolero:"bolero",son:"son"};
  for(const line of raw.replace(/\r/g,"").split("\n")){
    const d=/^\s*\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}\s*$/i.exec(line);
    if(d){const k=d[1].toLowerCase(),v=d[2]||"";
      if(k==="title"||k==="t")title=v;else if(k==="key")key=v;else if(k==="capo")capo=v;else if(k==="artist"||k==="composer")artist=v;
      else if(k==="time")meter=v;
      else if(k==="meta"){const mm=/^rhythm\s+(.+)$/i.exec(v);if(mm){const g=mm[1].toLowerCase();genre=GMAP[g]||Object.entries(GMAP).find(([a])=>g.startsWith(a))?.[1]||"otro"}}
      else if(k==="chorus")out.push("#"+(v||"Estribillo")+" (repetir)");
      else if(/^start_of_/.test(k))out.push("#"+(v||k.slice(9)));
      else if(/^(c|comment|ci|comment_italic)$/.test(k))out.push("#"+v);
      else if(k==="soc"||k==="start_of_chorus")out.push("#"+(v||"Estribillo"));
      else if(k==="sov"||k==="start_of_verse")out.push("#"+(v||"Verso"));
      else if(k==="sob"||k==="start_of_bridge")out.push("#"+(v||"Puente"));
      continue}
    if(/^\s*#/.test(line))continue;
    out.push(line);
  }
  while(out.length&&!out[out.length-1].trim())out.pop();
  return{title:title||fallbackTitle,key,capo,origin:artist,meter,genre,text:out.join("\n")};
}
function songKeys(title){
  const s=String(title||""),art=x=>x.replace(/^(la|el|las|los|tuna de|himno de)\s+/i,"");
  const noPar=s.replace(/\(.*?\)/g,"").trim(),par=(/\((.*?)\)/.exec(s)||[])[1]||"";
  return[...new Set([s,art(s),noPar,art(noPar),par].map(fold).filter(x=>x.length>2))];
}

async function loadTuna(id){

  S.tunas.push(tuna);
  const files=[];
  for(const b of [].concat(cfg.bundel||[])){
    const tex=await getText(b),dir=dirOf(b);
    tex.split("\n").forEach(l=>{const m=/^\s*\\input\{([^}]+)\}/.exec(l);if(m)files.push({path:dir+m[1].replace(/\.tex$/,"")+".tex",label:cfg.label||""})});
  }

  const res=await Promise.allSettled(files.map(async f=>({f,raw:await getText(f.path)})));

    const{f,raw}=r.value,fb=f.path.split("/").pop().replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");

  }
}

function renderRecsView(){
  const recs=S.recs.filter(r=>!S.rT||r.tunaId===S.rT).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<h3 class="sh">${esc(t("recAll"))}<select id="rT" aria-label="${esc(t("tunas"))}" style="width:auto"><option value="">${esc(t("allT"))}</option>${S.tunas.slice().sort(sortT).map(x=>`<option value="${esc(x.id)}"${S.rT===x.id?" selected":""}>${esc(x.name)}</option>`).join("")}</select></h3>
  ${recs.length?`<div class="reclist">${recs.map(r=>recCard(r,true)).join("")}</div>`:`<div class="empty">${esc(t("noRec"))}</div>`}`;
}
function renderTunas(){
  const list=S.tunas.slice().sort(sortT);
  return `<h3 class="sh">${esc(t("tunas"))}</h3>${list.length?`<div class="tunagrid">${list.map(x=>{
    const vs=S.versions.filter(v=>v.tunaId===x.id),rs=S.recs.filter(r=>r.tunaId===x.id);
    const rep=[...new Set(vs.map(v=>v.songId))].map(id=>S.songs.find(s=>s.id===id)).filter(Boolean).sort(sortT);
    const bc=becaOf(x.id);
    return `<article class="tuna"><div class="stripe" style="background:${bc==="transparent"?"var(--sunk)":bc}"></div><div class="bd">
      <h3>${esc(x.name)}</h3>
      <div class="meta" style="margin:0">${[x.city,x.country].filter(Boolean).map(esc).join(", ")}${x.founded?` · ${esc(t("founded"))} ${esc(x.founded)}`:""}</div>
      <div class="stats">${vs.length} ${esc(t("verCount"))} · ${rs.length} ${esc(t("recCount"))}</div>
      ${rep.length?`<div><span class="lbl">${esc(t("repertoire"))}</span><div class="rep">${rep.map(s=>`<button type="button" data-go="c-${esc(s.id)}">${esc(s.title)}</button>`).join("")}</div></div>`:""}
      ${x.notes?`<p class="vnotes" style="margin:0">${esc(x.notes)}</p>`:""}
      ${/^https:\/\//.test(x.web)?`<a href="${esc(x.web)}" target="_blank" rel="noopener">${esc(x.web.replace(/^https:\/\//,""))} ↗</a>`:""}
    </div></article>`}).join("")}</div>`:`<div class="empty">${esc(t("tunaEmpty"))}</div>`}`;
}

  "name": "Tuna de …",
  "city": "Salamanca",
  "country": "España",
  "founded": 1990,
  "beca": "azul",
  "web": "https://…",
  "songs": ["fonseca.cho", "clavelitos.cho"],
  "recordings": [
    { "song": "Fonseca", "title": "Certamen 2025", "date": "2025-05-10",
      "event": "Certamen de tunas", "url": "https://www.youtube.com/watch?v=…" }
  ]
}`;
const CHO=`{title: Nombre de la canción}
{key: Am}
{c: Intro}
[Am] [Dm] [E7] [Am]
{c: Estribillo}
[Am]Primera línea de la [Dm]letra
con los a[E7]cordes en su [Am]sitio`;
function renderJoin(){
  const block=(id,txt)=>`<div class="code"><button class="btn ghost" type="button" data-act="copy" data-id="${id}">${esc(t("copy"))}</button><pre id="${id}">${esc(txt)}</pre></div>`;
  return `<div class="join"><h3 class="sh">${esc(t("join"))}</h3><p>${esc(t("joinIntro"))}</p>
  <ol><li><a href="https://github.com/${REPO}/fork" target="_blank" rel="noopener">${esc(t("j1"))} ↗</a></li>
  <li>${esc(t("j2"))}${block("cfg",TUNA_JSON)}<p class="hint">beca: ${Object.keys(BECAS).join(", ")}</p></li>
  <li>${esc(t("j3"))}<p class="lbl" style="margin:10px 0 4px">${esc(t("chordpro"))}</p>${block("cho",CHO)}</li>
  <li>${esc(t("j4"))}</li></ol><p class="notice">${esc(t("jNote"))}</p></div>`;
}

/* events */
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);if(g.dataset.go.startsWith("c-"))window.scrollTo({top:0});return}
  const a=e.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  if(act==="pickA"){S.verA=id;if(S.verB===id)S.verB=null;render()}
  else if(act==="sh"){S.shift=Math.max(-11,Math.min(11,S.shift+Number(a.dataset.d)));render()}
  else if(act==="nota"){S.nota=a.dataset.k;render()}
  else if(act==="copy"){const txt=document.getElementById(id).textContent;try{await navigator.clipboard.writeText(txt);toast(t("copied"))}catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById(id));const s=getSelection();s.removeAllRanges();s.addRange(r)}}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;S._qf=true;render();S._qf=false}});
document.addEventListener("change",e=>{const id=e.target.id;
  if(id==="fT"){S.fT=e.target.value;render()}else if(id==="fG"){S.fG=e.target.value;render()}else if(id==="rT"){S.rT=e.target.value;render()}
  else if(id==="cmp"){S.verB=e.target.value||null;render()}else if(id==="align"){S.align=e.target.checked;render()}});
$("#lang").addEventListener("click",()=>{LANG=LANG==="es"?"en":"es";try{localStorage.setItem("cc-lang",LANG)}catch(e){}document.documentElement.lang=LANG;render()});
document.documentElement.lang=LANG;readHash();render();load();

</script>
